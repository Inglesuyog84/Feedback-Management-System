<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password - Feedback Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<header><div class="brand"><span class="brand-mark">F</span><h1>Feedback Management System</h1></div><button id="themeToggle" class="theme-toggle" type="button"></button></header>
<main style="max-width:420px">
  <div class="card auth-card">
    <h2>Reset password</h2>
    <div id="msg"></div>
    <form id="reset">
      <label>New password</label>
      <div class="password-field">
        <input type="password" id="password" minlength="6" required>
        <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password">Show</button>
      </div>
      <div class="password-strength" data-password-strength="password" aria-live="polite"></div>
      <label>Confirm new password</label>
      <div class="password-field">
        <input type="password" id="confirmPassword" minlength="6" required>
        <button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-label="Show password">Show</button>
      </div>
      <p><button type="submit">Reset password</button></p>
    </form>
    <a href="/index.html">Back to login</a>
  </div>
</main>
<script src="app.js"></script>
<script>
  const form = document.getElementById('reset');
  const msg = document.getElementById('msg');
  const token = new URLSearchParams(location.search).get('token');
  const passwordInput = document.getElementById('password');
  if (!token) {
    form.classList.add('hidden');
    flash(msg, 'This password reset link is missing its token. Request a new link.');
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!token) return;
    if (passwordInput.value !== confirmPassword.value) {
      flash(msg, 'Passwords do not match.');
      return;
    }
    try {
      const result = await api('/auth/reset-password', 'POST', { token, password: passwordInput.value });
      form.classList.add('hidden');
      flash(msg, result.message, 'ok');
    } catch (error) { flash(msg, error.message); }
  });
</script>
</body>
</html>
