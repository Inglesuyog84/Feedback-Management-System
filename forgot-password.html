<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password - Feedback Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<header><div class="brand"><span class="brand-mark">F</span><h1>Feedback Management System</h1></div><button id="themeToggle" class="theme-toggle" type="button"></button></header>
<main style="max-width:420px">
  <div class="card auth-card">
    <h2>Forgot password?</h2>
    <p class="muted">Link has been sent to your email.</p>
    <div id="msg"></div>
    <form id="forgot">
      <label>Email</label>
      <input type="email" id="email" required>
      <p><button type="submit">Send reset link</button></p>
    </form>
    <a href="/index.html">Back to login</a>
  </div>
</main>
<script src="app.js"></script>
<script>
  const form = document.getElementById('forgot');
  const msg = document.getElementById('msg');
  form.addEventListener('submit', async event => {
    event.preventDefault();
    try {
      const result = await api('/auth/forgot-password', 'POST', { email: email.value });
      form.classList.add('hidden');
      flash(msg, result.message, 'ok');
    } catch (error) { flash(msg, error.message); }
  });
</script>
</body>
</html>
